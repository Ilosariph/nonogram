services:
  nonogram:
    image: ${IMAGE_NAME:-dockerregistry.simon-wick.ch/nonogram}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    external: true
